services:
  postgres:
    image: postgres:16-alpine
    container_name: cars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cars-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  scrapy:
    build:
      context: .
      dockerfile: docker/scrapy/Dockerfile
    image: cars-scrapy:latest
    container_name: cars-scrapy
    profiles: ["tools"]
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  bruin:
    image: ghcr.io/bruin-data/bruin:latest
    platform: linux/amd64
    container_name: cars-bruin
    profiles: ["tools"]
    env_file:
      - .env
    working_dir: /workspace
    volumes:
      # Mount the whole repo so bruin can find the git root; the pipeline
      # itself lives at /workspace/bruin_pipeline.
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bruin"]
    command: ["--help"]

volumes:
  pgdata:
  pgadmin_data:
